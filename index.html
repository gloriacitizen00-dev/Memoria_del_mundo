<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memoria del Mundo</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================
   COLORS
========================= */

:root{

    --sand:#D8C29D;
    --sand-light:#EFE2C3;

    --brown:#4A3423;
    --brown-dark:#2B241D;

    --gold:#B58A3A;
    --gold-light:#D6B45C;

    --terracotta:#A65F3B;

    --white:#FFFFFF;

}


/* =========================
   BODY
========================= */

body{

    font-family:Georgia, "Times New Roman", serif;

    background:var(--sand-light);

    color:var(--brown-dark);

    min-height:100vh;

}


/* =========================
   HEADER
========================= */

header{

    width:100%;

    padding:22px 40px;

    background:var(--brown-dark);

    display:flex;

    justify-content:space-between;

    align-items:center;

}


/* LOGO TEXT */

.brand{

    color:var(--gold-light);

    font-size:22px;

    font-weight:bold;

    letter-spacing:2px;

}


/* NAVIGATION */

nav{

    display:flex;

    gap:30px;

}

nav a{

    color:var(--sand-light);

    text-decoration:none;

    font-size:15px;

    transition:.3s;

}

nav a:hover{

    color:var(--gold-light);

}


/* =========================
   HERO
========================= */

.hero{

    min-height:calc(100vh - 75px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:60px 20px;

}


/* =========================
   HERO LOGO
========================= */

.hero-logo-container{

    width:340px;

    height:340px;

    margin:auto;

    border-radius:50%;

    background:var(--sand-light);

    border:5px solid var(--gold);

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    box-shadow:

        0 0 0 10px rgba(181,138,58,.12),

        0 30px 60px rgba(74,52,35,.20);

}


.hero-logo{

    width:100%;

    transition:.4s;

}


.hero-logo:hover{

    transform:scale(1.05);

}

/* =========================
   TITLE
========================= */

.hero h1{

    margin-top:35px;

    font-size:48px;

    letter-spacing:4px;

    color:var(--brown-dark);

}


.hero h2{

    margin-top:10px;

    font-size:18px;

    font-weight:normal;

    letter-spacing:3px;

    color:var(--gold);

    text-transform:uppercase;

}


/* =========================
   DESCRIPTION
========================= */

.hero p{

    max-width:650px;

    margin-top:25px;

    font-size:18px;

    line-height:1.7;

    color:var(--brown);

}


/* =========================
   BUTTON
========================= */

.enter-button{

    margin-top:35px;

    padding:14px 35px;

    border:2px solid var(--gold);

    color:var(--brown-dark);

    text-decoration:none;

    letter-spacing:2px;

    transition:.3s;

}


.enter-button:hover{

    background:var(--gold);

    color:var(--white);

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{

        padding:18px 20px;

        flex-direction:column;

        gap:15px;

    }

    nav{

        gap:18px;

    }

    .hero-logo-container{

        width:270px;

        height:270px;

    }

    .hero h1{

        font-size:34px;

        letter-spacing:2px;

    }

    .hero h2{

        font-size:14px;

    }

    .hero p{

        font-size:16px;

    }

}

</style>

</head>


<body>


<header>

    <div class="brand">
        MEMORIA
    </div>

    <nav>

        <a href="#">Inicio</a>

        <a href="#">Historia</a>

        <a href="#">Culturas</a>

        <a href="#">Personajes</a>

    </nav>

</header>


<main class="hero">


    <div class="hero-logo-container">

        <img
            src="halcon.jpg"
            class="hero-logo"
            alt="Halcón dorado de Memoria del Mundo"
            loading="lazy">

    </div>


    <h1>
        MEMORIA DEL MUNDO
    </h1>


    <h2>
        La memoria de la humanidad
    </h2>


    <p>
        Un espacio para explorar los pueblos, las culturas,
        las ideas y los acontecimientos que han dado forma
        a nuestro mundo.
    </p>


    <a href="#" class="enter-button">
        EXPLORAR
    </a>


</main>


</body>

</html>
